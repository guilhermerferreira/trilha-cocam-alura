<section class="main">
  <app-input [itemQueVaiSerEditado]="itemParaSerEditado"></app-input>
  <div class="container">
    <div class="lista">
      <h4 class="title-list">Lista de Compras</h4>
      <div *ngIf="listaDeCompras.length > 0; else listaVazia">
        <div *ngFor="let item of listaDeCompras">
          <app-item
            [item]="item"
            (emitindoItemParaEditar)="editarItem($event)"
            (emitindoIdDoItemParaDeletar)="deletarItem($event)"
          ></app-item>
        </div>
      </div>
      <ng-template #listaVazia>
        <small>A lista não contem nenhum item no momento.</small>
      </ng-template>
    </div>
  </div>
</section>
