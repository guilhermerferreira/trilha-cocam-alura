<input
  class="checkbox"
  type="checkbox"
  name="comprado"
  id="comprado"
  (change)="alterarStatusComprado()"
>
<p [ngClass]="{'item-comprado': item.comprado, 'description': !item.comprado}"> {{ item.nome }} </p>
<div class="d-contents">
  <fa-icon class="delete-icon" [icon]="faTrash" (click)="deletarItem()"  ></fa-icon>
  <fa-icon class="edit-icon" [icon] ="faPen" (click)="editarItem()"></fa-icon>
</div>
<small class="date"> {{ item.data }} </small>
