<main class="principal">
  <h2 class="principal__titulo">Dados do cadastro</h2>

  <form class="principal__formulario" #f="ngForm" (ngSubmit)="cadastrar()">
    <h3 class="principal__subtitulo">Dados pessoais</h3>
    <div class="formulario__campo"> <!-- NOME -->
      <label class="campo__etiqueta" for="nome">Nome Completo</label>
      <input 
        name="nome" 
        id="nome"
        class="campo__escrita"
        ngModel
        #nome="ngModel"
        required
        minlength="2"
      >
      <div *ngIf="nome?.touched && nome?.invalid">
        <app-msg-erro
          mensagem="O campo deve ser preenchido" *ngIf="nome?.errors?.['required']">
        </app-msg-erro>
        <app-msg-erro
          mensagem="O nome deve conter pelo menos 2 caracteres" *ngIf="nome?.errors?.['minlength']">
        </app-msg-erro>
      </div>
    </div>
    <div class="formulario__dupla"> <!-- NASCIMENTO E CONTATO -->
      <div class="formulario__campo"> <!-- NASCIMENTO -->
        <label class="campo__etiqueta" for="nascimento">Nascimento</label>
        <input 
          name="nascimento" 
          id="nascimento" 
          type="date" 
          class="campo__escrita"
          ngModel
          #nascimento="ngModel"
          required
          idadeValidator
          maiorDeIdadeValidator
        />
        <div *ngIf="nascimento?.touched && nascimento?.invalid">
          <app-msg-erro
            mensagem="O campo deve ser preenchido." *ngIf="nascimento?.errors?.['required']">
          </app-msg-erro>
          <app-msg-erro
            mensagem="Idade inválida." *ngIf="nascimento?.errors?.['idadeValidator']">
          </app-msg-erro>
          <app-msg-erro
            mensagem="Idade mínima permitida de 18 anos." *ngIf="nascimento?.errors?.['maiorDeIdadeValidator']">
          </app-msg-erro>
        </div>
      </div>
      <div class="formulario__campo"> <!-- CONTATO -->
        <label class="campo__etiqueta" for="telefone">Contato</label>
        <input 
          name="telefone" 
          id="telefone" 
          type="tel" 
          placeholder="(XX) XXXXX-XXXX" 
          class="campo__escrita"
          ngModel
          #telefone="ngModel"
          required
          pattern="\(?\d{2}\)?\d{5}-?\d{4}"
        />
        <div *ngIf="telefone?.touched && telefone?.invalid">
          <app-msg-erro
            mensagem="O campo deve ser preenchido" *ngIf="telefone?.errors?.['required']">
          </app-msg-erro>
          <app-msg-erro
            mensagem="O telefone deve seguir o exemplo: (XX) XXXXX-XXXX" *ngIf="telefone?.errors?.['pattern']">
          </app-msg-erro>
        </div>        
      </div>
    </div>
    <div class="formulario__campo"> <!--  E-MAIL -->
      <label class="campo__etiqueta" for="email">E-mail</label>
      <input 
        name="email" 
        id="email" 
        type="email" 
        class="campo__escrita"
        ngModel
        #email="ngModel"
        required
        email
      />
      <div *ngIf="email?.touched && email?.invalid">
        <app-msg-erro
          mensagem="O campo deve ser preenchido" *ngIf="email?.errors?.['required']">
        </app-msg-erro>
        <app-msg-erro
          mensagem="O email deve conter @ e .dominio" *ngIf="email?.errors?.['email']">
        </app-msg-erro>
      </div>      
    </div>


    <h3 class="principal__subtitulo">Endereço</h3> 

    <div class="formulario__campo"> <!--  CEP -->
      <label class="campo__etiqueta" for="cep">CEP</label> 
      <input 
        name="cep" 
        id="cep" 
        class="campo__escrita" 
        ngModel
        #cep="ngModel"
        required
        pattern="^\d{5}-?\d{3}$"
        minlength="8"
        maxlength="9"
      />
      <div *ngIf="cep?.touched && cep?.invalid">
        <app-msg-erro
          mensagem="O campo deve ser preenchido" *ngIf="cep?.errors?.['required']">
        </app-msg-erro>
          <app-msg-erro
          mensagem="CEP inválido" *ngIf="cep?.errors?.['pattern']">
        </app-msg-erro>
      </div>
    </div>

    <div class="formulario__campo"> <!--  ENDEREÇO -->
      <label class="campo__etiqueta" for="endereco">Endereço</label>
      <input 
        name="endereco" 
        id="endereco" 
        class="campo__escrita"
        ngModel
        #endereco="ngModel"
        required 
      />
    </div>
    <div class="formulario__dupla"> <!--  NUMERO E COMPLEMENTO -->
      <div class="formulario__campo"> <!--  NUMERO -->>
        <label class="campo__etiqueta" for="numero">Numero</label>
        <input 
          name="numero" 
          id="numero" 
          class="campo__escrita" 
          ngModel
          #numero="ngModel"
          required
        />
      </div>
      <div class="formulario__campo"> <!--  COMPLEMENTO -->>
        <label class="campo__etiqueta" for="complemento">Complemento</label>
        <input 
          name="complemento" 
          id="complemento" 
          class="campo__escrita"
          ngModel
          #complemento="ngModel" 
        />
      </div>
    </div>
    <div class="formulario__campo"> <!--  BAIRRO -->
      <label class="campo__etiqueta" for="bairro">Bairro</label>
      <input 
        name="bairro" 
        id="bairro" 
        class="campo__escrita" 
        ngModel
        #bairro="ngModel"
        required
      />
    </div>
    <div class="formulario__dupla"> <!--  CIDADE E UF -->
      <div class="formulario__campo"> <!--  CIDADE -->>
        <label class="campo__etiqueta" for="cidade">Cidade</label>
        <input 
          name="cidade" 
          id="cidade" 
          class="campo__escrita" 
          ngModel
          #cidade="ngModel"
          required=""
        />
      </div>

      <div class="formulario__campo"> <!--  UF -->>
        <label class="campo__etiqueta" for="estado">UF</label>
        <select 
          id="estado" 
          name="estado" 
          class="campo__escrita"
          ngModel
          #uf="ngModel"
          required
        >
          <option value="AC">Acre</option>
          <option value="AL">Alagoas</option>
          <option value="AP">Amapá</option>
          <option value="AM">Amazonas</option>
          <option value="BA">Bahia</option>
          <option value="CE">Ceará</option>
          <option value="DF">Distrito Federal</option>
          <option value="ES">Espírito Santo</option>
          <option value="GO">Goiás</option>
          <option value="MA">Maranhão</option>
          <option value="MT">Mato Grosso</option>
          <option value="MS">Mato Grosso do Sul</option>
          <option value="MG">Minas Gerais</option>
          <option value="PA">Pará</option>
          <option value="PB">Paraíba</option>
          <option value="PR">Paraná</option>
          <option value="PE">Pernambuco</option>
          <option value="PI">Piauí</option>
          <option value="RJ">Rio de Janeiro</option>
          <option value="RN">Rio Grande do Norte</option>
          <option value="RS">Rio Grande do Sul</option>
          <option value="RO">Rondônia</option>
          <option value="RR">Roraima</option>
          <option value="SC">Santa Catarina</option>
          <option value="SP">São Paulo</option>
          <option value="SE">Sergipe</option>
          <option value="TO">Tocantins</option>
          <option value="EX">Estrangeiro</option>
        </select>
      </div>

    </div>
    <button type="submit" class="formulario__botao">Enviar formulário</button>
    </form>
</main>
