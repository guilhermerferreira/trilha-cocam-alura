<section class="container">
  <header class="header d-flex">
    <div class="buscar-pensamentos">
      <input
        type="search"
        class="filtro"
        placeholder="Oque você procura? "
        (keyup)="buscarPensamento()"
        [(ngModel)]="filtro"
      >
    </div>
    <h2 class="ff-inter">{{  titulo }}</h2>
    <div class="botoes">
      <button class="botao">Meu Mural</button>
      <button class="botao" (click)="listarFavoritos()">Meus Favoritos</button>
      <button routerLink="/criarPensamento" class="botao">Adicionar pensamento</button>
    </div>
  </header>
  <div class="mural" *ngIf="listaPensamentos.length > 0 else semPensamentos">
    <div *ngFor="let pensamento of listaPensamentos">
      <app-pensamento
        [pensamento]="pensamento"
        [listaFavoritos]="listaFavoritos"
        >
      </app-pensamento>
    </div>
  </div>
</section>
<app-botao-carregar-mais
  [temPensamento]="temPensamento"
  (click)="carregarMais()">
</app-botao-carregar-mais>
<ng-template #semPensamentos>
  <div class="ff-inter sem-pensamentos">
    <p>Nenhum pensamento adicionado ainda!</p>
  </div>
</ng-template>
